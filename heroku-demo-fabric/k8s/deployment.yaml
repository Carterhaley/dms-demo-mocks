apiVersion: apps/v1
kind: Deployment
metadata:
  name: heroku-demo-fabric
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heroku-demo-fabric
  template:
    metadata:
      labels:
        app: heroku-demo-fabric
    spec:
      nodeName: ip-10-102-40-148.ec2.internal
      containers:
        - name: heroku-demo-fabric
          image: docker.io/library/heroku-demo-fabric:eks
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: heroku-demo-fabric-lb
  namespace: default
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-07d33a85fac63f23c,subnet-0562a31a0f56ef5b9,subnet-016aecf1390778352
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
    service.beta.kubernetes.io/aws-load-balancer-ip-address-type: ipv4
    service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: heroku-demo-fabric
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
